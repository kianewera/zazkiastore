services:
  - type: web
    name: drip-client-store
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: drip-store-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: riski
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
